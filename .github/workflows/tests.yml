name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix native/cordis
      - run: node native/cordis/run.mjs --self-test
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
